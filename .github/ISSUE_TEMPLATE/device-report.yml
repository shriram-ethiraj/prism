name: Device report
description: Tell us how Prism works on your Samsung monitor, including partial success.
title: "Device report"
body:
  - type: markdown
    attributes:
      value: "Partial reports are welcome—test only what you can. Keep addresses, serial numbers, credentials, raw logs and recovery files out of the report."
  - type: input
    id: model
    attributes:
      label: Monitor model
      placeholder: LS28BG702EWXXL
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Full firmware string
      description: Copy the full software version from Settings → Support → About.
      placeholder: T-PTMLWWC-1720.7
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Prism build
      placeholder: 0.2.10
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: What works?
      description: "For each line, write works, has issues, or not tested. Mention the app/input if relevant. For power-on, report standby and a full power-disconnect cold boot separately. Recovery is optional; don't change settings just to complete this report."
      value: |
        Installation and screen fit:
        Apps and HDMI/DisplayPort switching:
        Home button (from an app / from an input):
        Power-on (standby / cold boot):
        Samsung Home / Settings access:
        Recovery (only if tested):
    validations:
      required: true
  - type: textarea
    id: findings
    attributes:
      label: Anything else? (optional)
      description: Problems, cropped screenshots, or setup details you know, such as computer OS or Tizen version. No technical investigation needed.
